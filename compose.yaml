services:
  runningbuddy:
    build:
      context: .
      args:
        VITE_MAP_STYLE_URL: "${VITE_MAP_STYLE_URL:-}"
    image: runningbuddy:local
    restart: unless-stopped
    ports:
      - "${RUNNINGBUDDY_PORT:-7317}:3000"
    # Everything user-configurable comes straight from .env, so adding a new
    # setting only means adding it there. Blank entries are passed through as
    # empty strings, which Config::from_env treats as unset.
    env_file:
      - path: .env
        required: false
    # Container-specific values only. These override .env, which holds the
    # host-side equivalents for running the binary directly.
    environment:
      TZ: "${TZ:-America/Chicago}"
      RUST_LOG: "info,runningbuddy=debug"
      RUNNINGBUDDY_BIND_ADDR: "0.0.0.0:3000"
      RUNNINGBUDDY_DATABASE_URL: "sqlite:///data/runningbuddy.db?mode=rwc"
    volumes:
      - ./data:/data
    labels:
      # autoheal (~/git/autoheal) restarts this container when unhealthy.
      - autoheal=true
    healthcheck:
      # Minimal image (bash only); probe the app's internal port via /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
